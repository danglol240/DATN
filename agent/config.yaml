backend_url: "https://localhost:3000"
heartbeat_interval: 30
# Sinh cert: openssl req -x509 -newkey rsa:2048 -keyout agent.key -out agent.crt \
#              -days 3650 -nodes -subj "/CN=$(hostname)/O=EDR" \
#              -addext "subjectAltName=DNS:$(hostname),IP:127.0.0.1"
# Thêm vào agent: python add_key.py --cert agent.crt --key agent.key [--backend-cert backend.crt]
# Đăng ký lên backend: Dashboard → Agents → ⋮ → Manage TLS Key

# ssl_verify: cert của backend để pin-verify TLS khi agent gọi lên backend.
#   false = bỏ qua verify (dev only).
ssl_verify: "./certs/backend-cert.pem"

# Agent HTTPS server — backend push commands trực tiếp tới đây
listen_port: 8443
agent_cert: "./certs/agent-cert.pem"
agent_key:  "./certs/agent-key.pem"

# backend_cert: cert của backend để pin-verify client cert khi backend push lệnh (mTLS).
#   null = bỏ qua verify (không khuyến nghị).
backend_cert: "./certs/backend-cert.pem"
